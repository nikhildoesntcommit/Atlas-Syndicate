<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Atlas Syndicate: a pixel-art arcade game about building an interplanetary supply chain.">
<meta name="theme-color" content="#0d0e10">
<title>Atlas Syndicate</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="screen" width="480" height="270" aria-label="Atlas Syndicate game screen">This game needs a browser with canvas support.</canvas>
<input id="kbd" type="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" aria-hidden="true" tabindex="-1">
<noscript><p class="noscript">Atlas Syndicate needs JavaScript.</p></noscript>
<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/sim/world.js"></script>
<script src="js/sim/economy.js"></script>
<script src="js/sim/logistics.js"></script>
<script src="js/sim/actions.js"></script>
<script src="js/sim/events.js"></script>
<script src="js/sim/sim.js"></script>
<script src="js/sim/bot.js"></script>
<script src="js/render/font.js"></script>
<script src="js/render/sprites.js"></script>
<script src="js/render/core.js"></script>
<script src="js/render/world.js"></script>
<script src="js/render/hud.js"></script>
<script src="js/render/fx.js"></script>
<script src="js/audio/sfx.js"></script>
<script src="js/audio/music.js"></script>
<script src="js/ui/actions.js"></script>
<script src="js/ui/tips.js"></script>
<script src="js/ui/onboarding.js"></script>
<script src="js/ui/screens.js"></script>
<script src="js/ui/input.js"></script>
<script src="js/main.js"></script>
</body>
</html>
